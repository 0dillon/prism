name: Keep the database awake

# A free Supabase project is paused after 7 days without activity. This calls the deployed
# keepalive endpoint every two days, as a backup to the daily Vercel cron. A failed run means the
# database could not be reached: check whether the project has been paused and restore it.
on:
  schedule:
    - cron: "17 7 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the keepalive endpoint
        run: curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 30 https://prism-ng.vercel.app/api/keepalive
