[project]
name = "prism-backend"
version = "0.1.0"
description = "Prism backend: adaptive educational rendering engine API"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "asyncpg",
    "pyjwt[crypto]",
    "httpx",
    "openai",
    "python-multipart",
    "pypdf",
    "python-ulid",
    "orjson",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "asyncpg-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_db: needs the local Supabase stack (npx supabase start)",
    "injection: prompt-injection fixtures",
    "live: calls a real provider; never runs in CI",
]
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print()
    "SIM",       # simplify
    "TID",       # tidy imports (banned-api below)
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit security
]
ignore = [
    "S101",      # assert is fine in tests and invariant checks
]

# Privileged database access is restricted to an explicit allowlist. Adding a new
# privileged call site therefore requires editing this file, which is a reviewable,
# greppable event. See brief section 10.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.db.privileged".msg = "Privileged (service-role) DB access is allowlisted in pyproject.toml. See docs/privileged-access.md."

[tool.ruff.lint.per-file-ignores]
"app/db/*" = ["TID251"]
"app/repositories/privileged/*" = ["TID251"]
"tests/*" = ["S", "TID251"]
# This module exists to normalise ambiguous Unicode, so it must contain it.
"app/ai/ingestion/grounding.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
